; Generated by LCD Wizard - https://lcdwizard.com
; MyUI - ESP32-S3

[platformio]
src_dir = .

[env:esp32-s3-devkitc-1]
; Pinned: pioarduino, Arduino core 3.x - the core the Arduino IDE installs.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; The sketch folder is the source folder (src_dir above): every file in it is
; compiled, src/ included - so keep a backup copy of the project outside it.
; lib/ holds libraries, which PlatformIO builds as libraries, and test/ its
; unit tests: neither is part of the sketch.
build_src_filter = +<*> -<.git/> -<.svn/> -<lib/> -<test/>

lib_deps =
    lvgl/lvgl@9.4.0
    moononournation/GFX Library for Arduino@1.6.9
    lewisxhe/SensorLib@0.5.1
    ; Wire - FT3168 / FT6146 is read directly by the generated sketch - no driver library needed
    ; SD - "SDCard" - bundled with the core
    ; SPI - SPI bus - bundled with the core
; See LIBRARIES.md for install names and links.

build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -I .
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

; N16R8: 16 MB flash, 8 MB octal PSRAM.
; Big app partitions - app 12 MB, files 3.9 MB.
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
; lw_lean.py leaves out the 325 LVGL sources lv_conf.h switches off (they compile to nothing).
extra_scripts = pre:lw_lean.py
board_build.arduino.memory_type = qio_opi
